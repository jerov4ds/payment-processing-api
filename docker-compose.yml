services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4317
      LOG_LEVEL: info
      API_KEYS: demo:dev-api-key-change-me
      REPOSITORY_DRIVER: postgres
      DATABASE_URL: postgres://payments:payments@postgres:5432/payments
      AUTO_MIGRATE: "true"
      CORS_ORIGINS: ""
      GATEWAY_MIN_LATENCY_MS: 20
      GATEWAY_MAX_LATENCY_MS: 50
      GATEWAY_TRANSIENT_FAILURE_RATE: 0
      GATEWAY_PERMANENT_FAILURE_RATE: 0
      GATEWAY_SEED: 1
    ports:
      - "127.0.0.1:4317:4317"
    depends_on:
      postgres:
        condition: service_healthy
